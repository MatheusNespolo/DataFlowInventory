name: CI — Lint & Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            simulator/package-lock.json
            test/mqtt_probe/package-lock.json

      - name: Instalar dependências (server)
        run: cd server && npm ci

      - name: Instalar dependências (simulator)
        run: cd simulator && npm ci

      - name: Instalar dependências (mqtt_probe)
        run: cd test/mqtt_probe && npm ci

      - name: Lint JavaScript (server + simulator)
        run: |
          cd server && npx eslint . || echo "ESLint não configurado — pulando"
          cd ../simulator && npx eslint . || echo "ESLint não configurado — pulando"

  secret-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: TruffleHog Scan (detectar segredos)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            simulator/package-lock.json
            test/mqtt_probe/package-lock.json

      - name: Install dependencies
        run: |
          cd server && npm ci
          cd ../simulator && npm ci
          cd ../test/mqtt_probe && npm ci

      - name: Audit vulnerabilities (server)
        run: cd server && npm audit --audit-level=critical

      - name: Audit vulnerabilities (simulator)
        run: cd simulator && npm audit --audit-level=critical

      - name: Audit vulnerabilities (mqtt_probe)
        run: cd test/mqtt_probe && npm audit --audit-level=critical

  arduino-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.0.0'

      - name: Cache Arduino cores and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: ${{ runner.os }}-arduino-${{ hashFiles('**/*.ino') }}
          restore-keys: |
            ${{ runner.os }}-arduino-

      - name: Configurar Arduino CLI
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index

      - name: Instalar cores Arduino
        run: |
          arduino-cli core install arduino:avr
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Instalar bibliotecas Arduino
        run: |
          arduino-cli lib install "LiquidCrystal I2C" "ArduinoJson@6.21.5" "PubSubClient"

      - name: Criar secrets.h de exemplo (arquivo real não é versionado)
        run: cp esp32/gateway_mqtt/secrets.h.example esp32/gateway_mqtt/secrets.h

      - name: Compilar Arduino Uno (principal) e conferir RAM (máx. 65%)
        run: |
          set -o pipefail
          arduino-cli compile --fqbn arduino:avr:uno --warnings all arduino/data_flow_inventory/data_flow_inventory.ino 2>&1 | tee uno.log
          ram=$(grep -oP 'Global variables use \d+ bytes \(\K\d+' uno.log)
          echo "RAM global do Uno: ${ram}%"
          test "$ram" -le 65

      - name: Compilar ESP32 (gateway MQTT)
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all esp32/gateway_mqtt/gateway_mqtt.ino

      - name: Compilar Arduino Uno (teste AB)
        run: arduino-cli compile --fqbn arduino:avr:uno --warnings all test/esteira_peca_b/arduino_esteiras_ab/arduino_esteiras_ab.ino

      - name: Compilar ESP32 (teste AB)
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all test/esteira_peca_b/esp32_esteiras_ab/esp32_esteiras_ab.ino

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            simulator/package-lock.json
            test/frontend_smoke/package-lock.json

      - name: Instalar dependências (server, simulator, testes E2E)
        run: |
          cd server && npm ci
          cd ../simulator && npm ci
          cd ../test/frontend_smoke && npm ci

      - name: Testes unitários do frontend (node --test)
        run: node --test "test/frontend/*.test.mjs"

      - name: Instalar Chromium (Playwright)
        run: cd test/frontend_smoke && npx playwright install --with-deps chromium

      - name: Testes E2E — botões, navegação, arquitetura, resiliência, celular e CSP
        run: cd test/frontend_smoke && npx playwright test

      - name: Publicar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/frontend_smoke/playwright-report/
          retention-days: 7

  server-metrics-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            test/server_metrics/package-lock.json

      - name: Instalar dependências (server e testes de métricas)
        run: |
          cd server && npm ci
          cd ../test/server_metrics && npm ci

      - name: Testes das métricas e da infraestrutura de observabilidade (sem Docker)
        run: cd test/server_metrics && npm test

  firmware-logica:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Testes da lógica do firmware do Uno (g++ no PC)
        run: make -C test/firmware_uno test
