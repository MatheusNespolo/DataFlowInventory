<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador - Data Flow Inventory</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header>
    <h1>Simulador - Data Flow Inventory</h1>
    <span>Status: <span id="status-conexao">Offline</span></span>
  </header>
  <main>
    <section>
      <button onclick="solicitarPeca('A')">Solicitar Peça A</button>
      <button onclick="solicitarPeca('B')">Solicitar Peça B</button>
      <button onclick="solicitarPeca('C')">Solicitar Peça C</button>
    </section>
    <section>
      <h2>Status do Sistema</h2>
      <p>Estado: <span id="estado">Aguardando</span></p>
      <p>Uptime: <span id="uptime">0s</span></p>
    </section>
    <section>
      <h2>Histórico</h2>
      <ul id="historico"></ul>
    </section>
  </main>
  <script src="./js/app.js"></script>
</body>
</html>
